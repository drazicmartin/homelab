type: http
name: pushover
log_level: debug
group_wait: 30s
group_threshold: 10
format: |
  {
    "token": "{{ env "PUSHOVER_TOKEN" }}",
    "user": "{{ env "PUSHOVER_USER" }}",
    "title": "CrowdSec AppSec block",
    "message": "{{range . -}}{{.Source.Value}} → {{.Scenario}}\n{{end -}}"
  }
url: https://api.pushover.net/1/messages.json
method: POST
headers:
  Content-Type: application/json
