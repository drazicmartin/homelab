name: appsec_notify
filters:
  - Alert.GetScenario() startsWith "crowdsecurity/vpatch-" || Alert.GetScenario() startsWith "crowdsecurity/generic-" || Alert.GetScenario() == "crowdsecurity/appsec-vpatch"
notifications:
  - pushover
on_success: continue
---
name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
duration_expr: Sprintf('%dh', (GetDecisionsCount(Alert.GetValue()) + 1) * 4)
on_success: break
---
name: default_range_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Range"
decisions:
  - type: ban
    duration: 4h
on_success: break
