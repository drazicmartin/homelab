services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      BOUNCER_KEY_TRAEFIK: ${BOUNCER_KEY_TRAEFIK}   # registers the Traefik bouncer automatically
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - /data/coolify/proxy/access.log:/var/log/traefik/access.log:ro
      - ./config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./config/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - ./config/notifications/pushover.yaml:/etc/crowdsec/notifications/pushover.yaml:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      coolify:
        aliases:
          - crowdsec

  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      crowdsec:
        condition: service_healthy
    environment:
      CONFIG_INSTANCE_LAPI_URL: http://crowdsec:8080
      CONFIG_INSTANCE_LAPI_AUTH_USERNAME: crowdsec-web-ui
      CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: ${CROWDSEC_UI_PASSWORD}
    volumes:
      - crowdsec-ui-data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q --spider http://127.0.0.1:3000/api/health ||
          curl -fso /dev/null http://127.0.0.1:3000/api/health ||
          node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - coolify

volumes:
  crowdsec-data:
  crowdsec-config:
  crowdsec-ui-data:

networks:
  coolify:
    external: true
