services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      BOUNCER_KEY_TRAEFIK: ${BOUNCER_KEY_TRAEFIK}   # registers the Traefik bouncer automatically
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ./acquis.yaml
        target: /etc/crowdsec/acquis.yaml
        content: |
          source: docker
          container_name:
            - coolify-proxy
          labels:
            type: traefik
    networks:
      coolify:
        aliases:
          - crowdsec

  crowdsec-web-ui:
    image: ghcr.io/theduffman85/crowdsec-web-ui:latest
    restart: unless-stopped
    depends_on:
      - crowdsec
    environment:
      CROWDSEC_URL: http://crowdsec:8080
      CROWDSEC_USER: crowdsec-web-ui
      CROWDSEC_PASSWORD: ${CROWDSEC_UI_PASSWORD}
    volumes:
      - crowdsec-ui-data:/app/data
    networks:
      - coolify

volumes:
  crowdsec-data:
  crowdsec-config:
  crowdsec-ui-data:

networks:
  coolify:
    external: true
